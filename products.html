<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products Dashboard</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 24px;
    }
    .wrap {
      max-width: 1200px;
      margin: auto;
    }
    .topbar {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      padding: 18px 22px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .topbar h2 {
      margin: 0 0 6px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .count {
      font-size: 30px;
      font-weight: 700;
      color: #111827;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .search {
      min-width: 260px;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
    }
    .refresh {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .status {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.show { display: block; }
    .loading { background: #fff7ed; color: #9a3412; }
    .success { background: #ecfdf5; color: #065f46; }
    .error { background: #fef2f2; color: #991b1b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }
    .item h4 {
      margin: 0;
      font-size: 17px;
      color: #111827;
      word-break: break-word;
    }
    .empty {
      background: #fff;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h2>Portal Products Dashboard</h2>
      <div>List all API products from Apigee</div>
    </div>

    <div class="card">
      <div>Products</div>
      <div class="count" id="productsCount">0</div>
    </div>

    <div class="toolbar">
      <input class="search" type="text" id="portalSearch" placeholder="Search products..." />
      <button class="refresh" id="portalRefresh">Refresh</button>
    </div>

    <div class="status" id="portalStatus"></div>
    <div class="grid" id="portalContent"></div>
  </div>

  <script>
    (function () {
      var API_URL = "https://apiocesit.alrajhitakaful.com/v1/internal/apigee-mgmt/products";

      var state = {
        rawData: [],
        filteredData: []
      };

      var productsCountEl = document.getElementById("productsCount");
      var contentEl = document.getElementById("portalContent");
      var statusEl = document.getElementById("portalStatus");
      var searchEl = document.getElementById("portalSearch");
      var refreshEl = document.getElementById("portalRefresh");

      function setStatus(message, type) {
        statusEl.className = "status show " + type;
        statusEl.textContent = message;
      }

      function hideStatus() {
        statusEl.className = "status";
        statusEl.textContent = "";
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function apiGetProducts() {
        var response = await fetch(API_URL, {
          method: "GET",
          credentials: "include",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Request failed with status " + response.status);
        }

        return response.json();
      }

      function normalizeProducts(data) {
        if (!Array.isArray(data)) return [];
        return data.map(function (item) {
          return {
            name: typeof item === "string" ? item : (item.name || "Unnamed Product")
          };
        });
      }

      function renderProducts() {
        if (!state.filteredData.length) {
          contentEl.innerHTML = '<div class="empty">No products found</div>';
          return;
        }

        var html = "";
        for (var i = 0; i < state.filteredData.length; i++) {
          var item = state.filteredData[i];
          html += '<div class="item"><h4>' + escapeHtml(item.name) + '</h4></div>';
        }
        contentEl.innerHTML = html;
      }

      function applySearch(keyword) {
        var value = (keyword || "").toLowerCase().trim();
        if (!value) {
          state.filteredData = state.rawData.slice();
          renderProducts();
          return;
        }

        state.filteredData = state.rawData.filter(function (item) {
          return item.name.toLowerCase().indexOf(value) !== -1;
        });

        renderProducts();
      }

      async function loadProducts() {
        try {
          setStatus("Loading products...", "loading");

          var data = await apiGetProducts();
          state.rawData = normalizeProducts(data);
          state.filteredData = state.rawData.slice();

          productsCountEl.textContent = state.rawData.length;
          renderProducts();

          setStatus(state.rawData.length + " product(s) loaded", "success");
          setTimeout(hideStatus, 1500);
        } catch (error) {
          productsCountEl.textContent = "0";
          contentEl.innerHTML =
            '<div class="empty">Unable to load products<br>' +
            escapeHtml(error.message) +
            '</div>';
          setStatus("Failed to load products", "error");
        }
      }

      searchEl.addEventListener("input", function () {
        applySearch(this.value);
      });

      refreshEl.addEventListener("click", function () {
        loadProducts();
      });

      loadProducts();
    })();
  </script>
</body>
</html>
